name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/verify-chunking-update-011CUTGJ6o2sukhq3EnBCpKi]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://ooobo.github.io/parakeet.js/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install root dependencies
        run: npm install

      - name: Install demo dependencies
        working-directory: examples/react-demo-dev
        run: npm install

      - name: Build demo
        working-directory: examples/react-demo-dev
        run: npm run build
        env:
          NODE_ENV: production

      - name: List build output
        run: ls -la examples/react-demo-dev/dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/react-demo-dev/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
